version: 2
updates:
  # The real manifest lives in prototype/. The repo root has a package.json with
  # no dependencies and a 143-byte stub lockfile.
  - package-ecosystem: npm
    directory: /prototype
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps arrive as one PR; majors come separately, because
      # a major here means a real review (stellar-sdk 15 -> 17 changed
      # Keypair.sign's return type from Buffer to Uint8Array).
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
